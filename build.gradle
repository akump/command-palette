plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content { includeGroupByRegex("net\\.runelite.*") }
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.commandpalette'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('runClient', JavaExec) {
	group = 'application'
	description = 'Runs RuneLite in developer mode with this plugin loaded'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.commandpalette.CommandPalettePluginTest'
	jvmArgs '-ea'
	if (System.getProperty('os.name').toLowerCase().contains('mac')) {
		// the client's full screen support reaches into a JDK-internal package on macOS
		jvmArgs '--add-exports', 'java.desktop/com.apple.eawt=ALL-UNNAMED', '--add-opens', 'java.desktop/com.apple.eawt=ALL-UNNAMED'
	}
	args '--developer-mode', '--debug'
}
